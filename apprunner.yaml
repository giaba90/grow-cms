version: 1.0
runtime: docker
build:
  commands:
    build:
      - echo "Build started on `date`"
      - docker build -f Dockerfile.prod -t grow-cms .
      - echo "Build completed on `date`"
run:
  runtime-version: latest
  command: sh -c "npx prisma migrate deploy && npm start"
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: DATABASE_URL
      value: $DATABASE_URL
    - name: NEXTAUTH_SECRET
      value: $NEXTAUTH_SECRET
    - name: NEXTAUTH_URL
      value: $NEXTAUTH_URL