# docker-compose.dev.yml
services:
  webapp:
    # Usa il Dockerfile specifico per lo sviluppo
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: grow-cms-app
    ports:
      - "3000:3000" # Porta dell'app Next.js
    volumes:
      - .:/app # Mappa la cartella del tuo codice Next.js nel container
      - /app/node_modules # Esclude la node_modules locale per usare quella del container
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    command: npm run dev # Avvia il server di sviluppo di Next.js
    depends_on:
      - db-dev
    restart: "no" # Non riavviare automaticamente in sviluppo

  db-dev:
    image: postgres:16-alpine 
    container_name: grow-cms-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432" # Mappa una porta diversa per il DB di sviluppo
    volumes:
      - dev_db_data:/var/lib/postgresql/data # Volume per la persistenza dei dati

volumes:
  dev_db_data: