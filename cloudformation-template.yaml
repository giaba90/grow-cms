AWSTemplateFormatVersion: '2010-09-09'
Description: 'GROW CMS Infrastructure - RDS PostgreSQL and App Runner'

Parameters:
  AppName:
    Type: String
    Default: grow-cms
    Description: Name of the application
  
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Database password
    ConstraintDescription: Must be at least 8 characters

  GitHubRepo:
    Type: String
    Description: GitHub repository URL (e.g., https://github.com/username/grow-cms)

Resources:
  # VPC and Security Groups
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-vpc

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-private-subnet-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-private-subnet-2

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-db-subnet-group

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS PostgreSQL
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppRunnerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-db-sg

  AppRunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for App Runner
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-apprunner-sg

  # RDS PostgreSQL
  PostgreSQLDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub ${AppName}-db
      DBInstanceClass: db.t3.micro
      Engine: postgres
      EngineVersion: '15.4'
      MasterUsername: postgres
      MasterUserPassword: !Ref DBPassword
      AllocatedStorage: 20
      StorageType: gp2
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      BackupRetentionPeriod: 7
      MultiAZ: false
      PubliclyAccessible: false
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-postgresql

  # App Runner Service
  AppRunnerService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Sub ${AppName}-service
      SourceConfiguration:
        AutoDeploymentsEnabled: true
        CodeRepository:
          RepositoryUrl: !Ref GitHubRepo
          SourceCodeVersion:
            Type: BRANCH
            Value: main
          CodeConfiguration:
            ConfigurationSource: CONFIGURATION_FILE
            CodeConfigurationValues:
              Runtime: DOCKER
              BuildCommand: docker build -f Dockerfile.prod -t grow-cms .
              StartCommand: sh -c "npx prisma migrate deploy && npm start"
              RuntimeEnvironmentVariables:
                NODE_ENV: production
                DATABASE_URL: !Sub 
                  - postgresql://postgres:${DBPassword}@${DBEndpoint}:5432/postgres
                  - DBEndpoint: !GetAtt PostgreSQLDB.Endpoint.Address
                    DBPassword: !Ref DBPassword
      InstanceConfiguration:
        Cpu: 0.25 vCPU
        Memory: 0.5 GB
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-apprunner

Outputs:
  DatabaseEndpoint:
    Description: RDS PostgreSQL Endpoint
    Value: !GetAtt PostgreSQLDB.Endpoint.Address
    Export:
      Name: !Sub ${AppName}-db-endpoint

  AppRunnerServiceUrl:
    Description: App Runner Service URL
    Value: !GetAtt AppRunnerService.ServiceUrl
    Export:
      Name: !Sub ${AppName}-service-url

  DatabaseURL:
    Description: Complete Database URL
    Value: !Sub 
      - postgresql://postgres:${DBPassword}@${DBEndpoint}:5432/postgres
      - DBEndpoint: !GetAtt PostgreSQLDB.Endpoint.Address
        DBPassword: !Ref DBPassword